name: Update games manifest

on:
  push:
    branches: [ main ]
    paths:
      - 'games/**'
      - 'tools/build-manifest.js'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate games.json
        run: node tools/build-manifest.js

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain games.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add games.json
            git commit -m "chore: update games.json [auto]"
            git push
          else
            echo "games.json déjà à jour, rien à commit."
          fi
