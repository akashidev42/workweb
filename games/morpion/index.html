<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morpion — AkashiGame</title>
<link rel="stylesheet" href="../../assets/theme.css">
<style>
  #grid{
    display:grid;
    grid-template-columns:repeat(3,90px);
    grid-template-rows:repeat(3,90px);
    gap:8px;
  }
  .cell{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:2.2rem;font-weight:700;
    cursor:pointer;
  }
  .cell:hover{border-color:var(--accent);}
  .cell.x{color:#3ea1e0;}
  .cell.o{color:#ff4d4d;}
  .mode-row{display:flex;gap:8px;}
</style>
</head>
<body>
<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; AkashiGame</a>
  <span class="game-title">Morpion</span>
  <div class="game-status"><span id="turn">Tour : X</span></div>
</header>

<div class="game-wrap">
  <div class="mode-row">
    <button class="btn primary" id="mode-cpu">Vs CPU</button>
    <button class="btn" id="mode-2p">2 joueurs</button>
  </div>
  <div id="grid"></div>
  <p class="hint" id="hint">Mode CPU actif. Tu joues X.</p>
  <button class="btn primary" id="restart">Rejouer</button>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="result">Terminé</h2>
    <button class="btn primary" id="overlay-restart">Rejouer</button>
  </div>
</div>

<script>
(function(){
  var grid = document.getElementById('grid');
  var turnEl = document.getElementById('turn');
  var hintEl = document.getElementById('hint');
  var overlay = document.getElementById('overlay');
  var resultEl = document.getElementById('result');

  var board, turn, over, vsCpu = true;
  var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function reset(){
    board = Array(9).fill(null);
    turn = 'X'; over = false;
    turnEl.textContent = 'Tour : ' + turn;
    overlay.classList.remove('show');
    render();
  }

  function render(){
    grid.innerHTML = '';
    board.forEach(function(v, i){
      var d = document.createElement('div');
      d.className = 'cell' + (v ? ' ' + v.toLowerCase() : '');
      d.textContent = v || '';
      d.addEventListener('click', function(){ play(i); });
      grid.appendChild(d);
    });
  }

  function winner(){
    for(var i=0;i<LINES.length;i++){
      var l = LINES[i];
      if(board[l[0]] && board[l[0]]===board[l[1]] && board[l[1]]===board[l[2]]) return board[l[0]];
    }
    if(board.every(function(v){return v;})) return 'draw';
    return null;
  }

  function play(i){
    if(over || board[i]) return;
    board[i] = turn;
    var w = winner();
    if(w){ endGame(w); return; }
    turn = turn === 'X' ? 'O' : 'X';
    turnEl.textContent = 'Tour : ' + turn;
    render();
    if(vsCpu && turn === 'O' && !over){
      setTimeout(cpuMove, 400);
    }
  }

  function cpuMove(){
    var empty = board.map(function(v,i){return v?null:i;}).filter(function(v){return v!==null;});
    if(empty.length === 0) return;
    var move = empty[Math.floor(Math.random()*empty.length)];
    for(var i=0;i<empty.length;i++){
      var test = board.slice(); test[empty[i]] = 'O';
      if(checkWin(test,'O')){ move = empty[i]; break; }
    }
    for(var i=0;i<empty.length;i++){
      var test = board.slice(); test[empty[i]] = 'X';
      if(checkWin(test,'X')){ move = empty[i]; break; }
    }
    play(move);
  }

  function checkWin(b, p){
    return LINES.some(function(l){ return b[l[0]]===p && b[l[1]]===p && b[l[2]]===p; });
  }

  function endGame(w){
    over = true;
    resultEl.textContent = w === 'draw' ? 'Match nul !' : (w + ' gagne !');
    render();
    overlay.classList.add('show');
  }

  document.getElementById('mode-cpu').addEventListener('click', function(){
    vsCpu = true;
    hintEl.textContent = 'Mode CPU actif. Tu joues X.';
    reset();
  });
  document.getElementById('mode-2p').addEventListener('click', function(){
    vsCpu = false;
    hintEl.textContent = 'Mode 2 joueurs. X puis O, à tour de rôle.';
    reset();
  });

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('overlay-restart').addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>
