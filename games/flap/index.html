<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flap — AkashiGame</title>
<link rel="stylesheet" href="../../assets/theme.css">
</head>
<body>
<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; AkashiGame</a>
  <span class="game-title">Flap</span>
  <div class="game-status"><span>Score <b id="score">0</b></span><span>Record <b id="best">0</b></span></div>
</header>

<div class="game-wrap">
  <canvas id="c" width="360" height="480" aria-label="Plateau de Flap"></canvas>
  <p class="hint">Clique, tape ou appuie sur espace pour battre des ailes et passer les obstacles.</p>
  <button class="btn primary" id="restart">Rejouer</button>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2>Crash !</h2>
    <p id="final">Score final : 0</p>
    <button class="btn primary" id="overlay-restart">Rejouer</button>
  </div>
</div>

<script>
(function(){
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var finalEl = document.getElementById('final');
  var best = Number(localStorage.getItem('akashi_flap_best') || 0);
  bestEl.textContent = best;

  var bird, pipes, score, running, started, loopId, frame;
  var GAP = 140, PIPE_W = 52, SPEED = 2.4;

  function reset(){
    bird = {x:80, y:H/2, vy:0, r:14};
    pipes = [];
    score = 0; running = true; started = false; frame = 0;
    scoreEl.textContent = score;
    overlay.classList.remove('show');
    draw();
    if(loopId) cancelAnimationFrame(loopId);
  }

  function flap(){
    if(!running) return;
    started = true;
    bird.vy = -7;
  }

  function addPipe(){
    var top = 60 + Math.random()*(H-GAP-160);
    pipes.push({x:W, top:top, passed:false});
  }

  function loop(){
    if(!running) return;
    if(started){
      frame++;
      bird.vy += 0.35;
      bird.y += bird.vy;

      if(frame % 90 === 0) addPipe();

      pipes.forEach(function(p){ p.x -= SPEED; });
      pipes = pipes.filter(function(p){ return p.x > -PIPE_W; });

      pipes.forEach(function(p){
        if(!p.passed && p.x + PIPE_W < bird.x){
          p.passed = true;
          score++;
          scoreEl.textContent = score;
        }
        var hitX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W;
        var hitY = bird.y - bird.r < p.top || bird.y + bird.r > p.top + GAP;
        if(hitX && hitY) endGame();
      });

      if(bird.y + bird.r > H || bird.y - bird.r < 0) endGame();
    }
    draw();
    loopId = requestAnimationFrame(loop);
  }

  function endGame(){
    running = false;
    if(score > best){
      best = score;
      localStorage.setItem('akashi_flap_best', best);
      bestEl.textContent = best;
    }
    finalEl.textContent = 'Score final : ' + score;
    overlay.classList.add('show');
  }

  function draw(){
    ctx.fillStyle = '#0e0e11';
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = '#2ecc71';
    pipes.forEach(function(p){
      ctx.fillRect(p.x, 0, PIPE_W, p.top);
      ctx.fillRect(p.x, p.top+GAP, PIPE_W, H-(p.top+GAP));
    });

    ctx.fillStyle = '#ff4d4d';
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI*2);
    ctx.fill();

    if(!started){
      ctx.fillStyle = '#8b8891';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Clique ou espace pour commencer', W/2, H/2 - 30);
    }
  }

  document.addEventListener('keydown', function(e){
    if(e.key === ' '){ e.preventDefault(); if(!running){ reset(); loop(); } else flap(); if(!loopId && running) loop(); }
  });
  canvas.addEventListener('mousedown', function(){ if(!running){ reset(); loop(); } else { flap(); if(started && !loopId) loop(); } });
  canvas.addEventListener('touchstart', function(e){ e.preventDefault(); if(!running){ reset(); loop(); } else flap(); });

  reset();
  loop();

  document.getElementById('restart').addEventListener('click', function(){ reset(); loop(); });
  document.getElementById('overlay-restart').addEventListener('click', function(){ reset(); loop(); });
})();
</script>
</body>
</html>
