<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mémoire — AkashiGame</title>
<link rel="stylesheet" href="../../assets/theme.css">
<style>
  #grid{
    display:grid;
    grid-template-columns:repeat(4,70px);
    gap:10px;
  }
  .card{
    width:70px;height:70px;
    border-radius:10px;
    background:var(--surface);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;
    cursor:pointer;
    user-select:none;
  }
  .card.flipped{background:var(--surface-2);border-color:var(--accent);}
  .card.matched{background:var(--accent-dim);border-color:var(--good);opacity:0.6;cursor:default;}
</style>
</head>
<body>
<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; AkashiGame</a>
  <span class="game-title">Mémoire</span>
  <div class="game-status"><span>Coups <b id="moves">0</b></span><span>Paires <b id="pairs">0</b>/8</span></div>
</header>

<div class="game-wrap">
  <div id="grid"></div>
  <p class="hint">Retrouve les 8 paires en un minimum de coups.</p>
  <button class="btn primary" id="restart">Rejouer</button>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2>Bien joué !</h2>
    <p id="final">Terminé en 0 coups</p>
    <button class="btn primary" id="overlay-restart">Rejouer</button>
  </div>
</div>

<script>
(function(){
  var symbols = ['🎮','🕹️','👾','🚀','⭐','🔥','💎','🍀'];
  var grid = document.getElementById('grid');
  var movesEl = document.getElementById('moves');
  var pairsEl = document.getElementById('pairs');
  var overlay = document.getElementById('overlay');
  var finalEl = document.getElementById('final');

  var cards, flipped, matched, moves, locked;

  function reset(){
    var deck = symbols.concat(symbols);
    deck.sort(function(){ return Math.random()-0.5; });
    cards = deck.map(function(s){ return {symbol:s, flipped:false, matched:false}; });
    flipped = []; matched = 0; moves = 0; locked = false;
    movesEl.textContent = moves;
    pairsEl.textContent = matched;
    overlay.classList.remove('show');
    render();
  }

  function render(){
    grid.innerHTML = '';
    cards.forEach(function(card, i){
      var d = document.createElement('div');
      d.className = 'card' + (card.flipped||card.matched ? (card.matched?' matched':' flipped') : '');
      d.textContent = (card.flipped||card.matched) ? card.symbol : '';
      d.addEventListener('click', function(){ flip(i); });
      grid.appendChild(d);
    });
  }

  function flip(i){
    if(locked || cards[i].flipped || cards[i].matched) return;
    cards[i].flipped = true;
    flipped.push(i);
    render();
    if(flipped.length === 2){
      moves++;
      movesEl.textContent = moves;
      locked = true;
      var a = cards[flipped[0]], b = cards[flipped[1]];
      if(a.symbol === b.symbol){
        a.matched = true; b.matched = true;
        matched++;
        pairsEl.textContent = matched;
        flipped = [];
        locked = false;
        render();
        if(matched === symbols.length){
          finalEl.textContent = 'Terminé en ' + moves + ' coups';
          overlay.classList.add('show');
        }
      } else {
        setTimeout(function(){
          a.flipped = false; b.flipped = false;
          flipped = [];
          locked = false;
          render();
        }, 700);
      }
    }
  }

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('overlay-restart').addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>
