<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Démineur — AkashiGame</title>
<link rel="stylesheet" href="../../assets/theme.css">
<style>
  #grid{
    display:grid;
    grid-template-columns:repeat(10,32px);
    grid-template-rows:repeat(10,32px);
    gap:2px;
    background:var(--surface-2);
    padding:6px;
    border-radius:10px;
  }
  .cell{
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    font-size:0.85rem;font-weight:700;
    cursor:pointer;
    user-select:none;
    border-radius:3px;
  }
  .cell.revealed{background:#151519;cursor:default;}
  .cell.mine{background:var(--accent-dim);}
  .cell.flag{background:var(--surface);}
  .c1{color:#3ea1e0;} .c2{color:#2ecc71;} .c3{color:#ff4d4d;} .c4{color:#c25ee0;}
  .c5{color:#e0a72e;} .c6{color:#5ee0c8;} .c7{color:#eceaf0;} .c8{color:#8b8891;}
</style>
</head>
<body>
<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; AkashiGame</a>
  <span class="game-title">Démineur</span>
  <div class="game-status"><span>Mines <b id="minesLeft">15</b></span><span>Temps <b id="timer">0</b>s</span></div>
</header>

<div class="game-wrap">
  <div id="grid"></div>
  <p class="hint">Clic gauche pour révéler, clic droit pour poser un drapeau. 15 mines cachées.</p>
  <button class="btn primary" id="restart">Rejouer</button>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="result">Terminé</h2>
    <button class="btn primary" id="overlay-restart">Rejouer</button>
  </div>
</div>

<script>
(function(){
  var SIZE = 10, MINES = 15;
  var grid = document.getElementById('grid');
  var minesLeftEl = document.getElementById('minesLeft');
  var timerEl = document.getElementById('timer');
  var overlay = document.getElementById('overlay');
  var resultEl = document.getElementById('result');

  var cells, over, revealedCount, flags, timerId, seconds, firstClick;

  function reset(){
    cells = [];
    for(var i=0;i<SIZE*SIZE;i++) cells.push({mine:false, revealed:false, flag:false, count:0});
    over = false; revealedCount = 0; flags = 0; seconds = 0; firstClick = true;
    minesLeftEl.textContent = MINES;
    timerEl.textContent = 0;
    overlay.classList.remove('show');
    if(timerId) clearInterval(timerId);
    render();
  }

  function idx(r,c){ return r*SIZE+c; }

  function placeMines(excludeIdx){
    var placed = 0;
    while(placed < MINES){
      var i = Math.floor(Math.random()*SIZE*SIZE);
      if(i === excludeIdx || cells[i].mine) continue;
      cells[i].mine = true;
      placed++;
    }
    for(var r=0;r<SIZE;r++){
      for(var c=0;c<SIZE;c++){
        if(cells[idx(r,c)].mine) continue;
        var n = 0;
        neighbors(r,c).forEach(function(k){ if(cells[k].mine) n++; });
        cells[idx(r,c)].count = n;
      }
    }
  }

  function neighbors(r,c){
    var res = [];
    for(var dr=-1;dr<=1;dr++) for(var dc=-1;dc<=1;dc++){
      if(dr===0 && dc===0) continue;
      var nr = r+dr, nc = c+dc;
      if(nr>=0 && nr<SIZE && nc>=0 && nc<SIZE) res.push(idx(nr,nc));
    }
    return res;
  }

  function reveal(i){
    if(cells[i].revealed || cells[i].flag) return;
    cells[i].revealed = true;
    revealedCount++;
    if(cells[i].count === 0 && !cells[i].mine){
      var r = Math.floor(i/SIZE), c = i%SIZE;
      neighbors(r,c).forEach(function(k){ if(!cells[k].revealed) reveal(k); });
    }
  }

  function render(){
    grid.innerHTML = '';
    for(var r=0;r<SIZE;r++){
      for(var c=0;c<SIZE;c++){
        (function(r,c){
          var i = idx(r,c);
          var cell = cells[i];
          var d = document.createElement('div');
          d.className = 'cell' + (cell.revealed ? ' revealed' : '') + (cell.revealed && cell.mine ? ' mine' : '');
          if(cell.revealed){
            if(cell.mine) d.textContent = '💣';
            else if(cell.count > 0){ d.textContent = cell.count; d.classList.add('c'+cell.count); }
          } else if(cell.flag){
            d.textContent = '🚩';
          }
          d.addEventListener('click', function(){ onClick(i); });
          d.addEventListener('contextmenu', function(e){ e.preventDefault(); onFlag(i); });
          grid.appendChild(d);
        })(r,c);
      }
    }
  }

  function onClick(i){
    if(over || cells[i].flag || cells[i].revealed) return;
    if(firstClick){
      placeMines(i);
      firstClick = false;
      seconds = 0;
      timerId = setInterval(function(){ seconds++; timerEl.textContent = seconds; }, 1000);
    }
    if(cells[i].mine){
      cells[i].revealed = true;
      endGame(false);
      render();
      return;
    }
    reveal(i);
    render();
    checkWin();
  }

  function onFlag(i){
    if(over || cells[i].revealed) return;
    cells[i].flag = !cells[i].flag;
    flags += cells[i].flag ? 1 : -1;
    minesLeftEl.textContent = MINES - flags;
    render();
  }

  function checkWin(){
    if(revealedCount === SIZE*SIZE - MINES){
      endGame(true);
    }
  }

  function endGame(win){
    over = true;
    if(timerId) clearInterval(timerId);
    resultEl.textContent = win ? 'Terrain déminé en ' + seconds + 's !' : 'Boum. Tu as touché une mine.';
    overlay.classList.add('show');
  }

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('overlay-restart').addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>
