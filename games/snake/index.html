<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — AkashiGame</title>
<link rel="stylesheet" href="../../assets/theme.css">
</head>
<body>
<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; AkashiGame</a>
  <span class="game-title">Snake</span>
  <div class="game-status"><span>Score <b id="score">0</b></span><span>Record <b id="best">0</b></span></div>
</header>

<div class="game-wrap">
  <canvas id="c" width="400" height="400" aria-label="Plateau de Snake"></canvas>
  <p class="hint">Flèches ou WASD pour diriger le serpent. Espace pour mettre en pause.</p>
  <button class="btn primary" id="restart">Rejouer</button>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2>Perdu !</h2>
    <p id="final-score">Score final : 0</p>
    <button class="btn primary" id="overlay-restart">Rejouer</button>
  </div>
</div>

<script>
(function(){
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var GRID = 20, CELLS = 20;
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var finalScoreEl = document.getElementById('final-score');
  var best = Number(localStorage.getItem('akashi_snake_best') || 0);
  bestEl.textContent = best;

  var snake, dir, nextDir, food, score, running, paused, loopId;

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    running = true;
    paused = false;
    placeFood();
    scoreEl.textContent = score;
    overlay.classList.remove('show');
    if(loopId) clearInterval(loopId);
    loopId = setInterval(tick, 100);
  }

  function placeFood(){
    while(true){
      food = {x:Math.floor(Math.random()*CELLS), y:Math.floor(Math.random()*CELLS)};
      if(!snake.some(function(s){return s.x===food.x && s.y===food.y;})) break;
    }
  }

  function tick(){
    if(!running || paused) return;
    dir = nextDir;
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if(head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS || snake.some(function(s){return s.x===head.x && s.y===head.y;})){
      gameOver();
      return;
    }

    snake.unshift(head);
    if(head.x === food.x && head.y === food.y){
      score += 10;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver(){
    running = false;
    clearInterval(loopId);
    if(score > best){
      best = score;
      localStorage.setItem('akashi_snake_best', best);
      bestEl.textContent = best;
    }
    finalScoreEl.textContent = 'Score final : ' + score;
    overlay.classList.add('show');
  }

  function draw(){
    ctx.fillStyle = '#0e0e11';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = '#ff4d4d';
    ctx.fillRect(food.x*GRID+2, food.y*GRID+2, GRID-4, GRID-4);

    snake.forEach(function(s, i){
      ctx.fillStyle = i===0 ? '#eceaf0' : '#3a3a40';
      ctx.fillRect(s.x*GRID+1, s.y*GRID+1, GRID-2, GRID-2);
    });
  }

  document.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    if(k===' '){ paused = !paused; return; }
    var map = {
      'arrowup':{x:0,y:-1}, 'w':{x:0,y:-1},
      'arrowdown':{x:0,y:1}, 's':{x:0,y:1},
      'arrowleft':{x:-1,y:0}, 'a':{x:-1,y:0},
      'arrowright':{x:1,y:0}, 'd':{x:1,y:0}
    };
    var nd = map[k];
    if(!nd) return;
    if(nd.x === -dir.x && nd.y === -dir.y) return;
    nextDir = nd;
    e.preventDefault();
  });

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('overlay-restart').addEventListener('click', reset);

  reset();
  draw();
})();
</script>
</body>
</html>
