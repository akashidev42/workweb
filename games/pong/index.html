<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong — AkashiGame</title>
<link rel="stylesheet" href="../../assets/theme.css">
</head>
<body>
<header class="game-header">
  <a href="../../index.html" class="back-link">&larr; AkashiGame</a>
  <span class="game-title">Pong</span>
  <div class="game-status"><span>Toi <b id="p1">0</b></span><span>CPU <b id="p2">0</b></span></div>
</header>

<div class="game-wrap">
  <canvas id="c" width="560" height="340" aria-label="Plateau de Pong"></canvas>
  <p class="hint">Souris ou flèches haut/bas pour bouger ta raquette. Premier à 5 points gagne.</p>
  <button class="btn primary" id="restart">Rejouer</button>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="result">Terminé</h2>
    <button class="btn primary" id="overlay-restart">Rejouer</button>
  </div>
</div>

<script>
(function(){
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var PW = 10, PH = 70;
  var p1y, p2y, ball, s1, s2, running, loopId;
  var p1El = document.getElementById('p1');
  var p2El = document.getElementById('p2');
  var overlay = document.getElementById('overlay');
  var resultEl = document.getElementById('result');

  function reset(){
    p1y = H/2 - PH/2;
    p2y = H/2 - PH/2;
    s1 = 0; s2 = 0;
    running = true;
    p1El.textContent = s1;
    p2El.textContent = s2;
    overlay.classList.remove('show');
    resetBall();
    if(loopId) cancelAnimationFrame(loopId);
    loop();
  }

  function resetBall(){
    ball = {x:W/2, y:H/2, vx: (Math.random()<0.5?-1:1)*4, vy:(Math.random()*4-2)};
  }

  canvas.addEventListener('mousemove', function(e){
    var rect = canvas.getBoundingClientRect();
    var y = (e.clientY - rect.top) * (H/rect.height);
    p1y = Math.max(0, Math.min(H-PH, y - PH/2));
  });

  var keys = {};
  document.addEventListener('keydown', function(e){ keys[e.key] = true; });
  document.addEventListener('keyup', function(e){ keys[e.key] = false; });

  function loop(){
    if(!running) return;

    if(keys['ArrowUp']) p1y -= 6;
    if(keys['ArrowDown']) p1y += 6;
    p1y = Math.max(0, Math.min(H-PH, p1y));

    var target = ball.y - PH/2;
    p2y += Math.max(-4, Math.min(4, target - p2y));
    p2y = Math.max(0, Math.min(H-PH, p2y));

    ball.x += ball.vx;
    ball.y += ball.vy;

    if(ball.y <= 0 || ball.y >= H) ball.vy *= -1;

    if(ball.x <= PW + 10 && ball.y >= p1y && ball.y <= p1y+PH){
      ball.vx = Math.abs(ball.vx) * 1.03;
      ball.vy += (ball.y - (p1y+PH/2)) * 0.08;
    }
    if(ball.x >= W - PW - 10 && ball.y >= p2y && ball.y <= p2y+PH){
      ball.vx = -Math.abs(ball.vx) * 1.03;
      ball.vy += (ball.y - (p2y+PH/2)) * 0.08;
    }

    if(ball.x < 0){ s2++; p2El.textContent = s2; checkEnd() || resetBall(); }
    if(ball.x > W){ s1++; p1El.textContent = s1; checkEnd() || resetBall(); }

    draw();
    loopId = requestAnimationFrame(loop);
  }

  function checkEnd(){
    if(s1 >= 5 || s2 >= 5){
      running = false;
      resultEl.textContent = s1 >= 5 ? 'Tu as gagné !' : 'Le CPU gagne.';
      overlay.classList.add('show');
      return true;
    }
    return false;
  }

  function draw(){
    ctx.fillStyle = '#0e0e11';
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = '#232228';
    ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#eceaf0';
    ctx.fillRect(10, p1y, PW, PH);
    ctx.fillRect(W-10-PW, p2y, PW, PH);

    ctx.fillStyle = '#ff4d4d';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, 6, 0, Math.PI*2); ctx.fill();
  }

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('overlay-restart').addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>
